name: Test skill
on:
  push:
  pull_request:
jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install optional validation dependencies
        run: python3 -m pip install numpy scipy jsonschema pillow
      - name: Run tests
        run: python3 -m unittest discover -s tests -v
      - name: Validate neutral fixture
        run: python3 scripts/validate_storyboard.py tests/fixtures/storyboard.json
